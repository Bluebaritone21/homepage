<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
        <link rel="stylesheet" href="style.css">
        <script src="wm.js"></script>
        <script src="apps/epiphany.js" defer></script>
        <script src="apps/texteditor.js" defer></script>
    </head>
    <hidden>
        <div id="window" class=window>
            <div id="windowheader" class=header></div>
            <br>
            <button class="close" id="close">&times;</button>
        </div>
    </hidden>
    <body>
        <div class="taskbar" id="taskbar">
        </div>
        <desktop>
            <br />
        <!-- <button id=debug-button onclick="makeDevTools()">debug</button> -->
        </desktop>
        <div class="activity-bar">Loading...</div>
        <button id="activity-button" onclick="toggleActivities()">Activities</button>
        <button id="battery-button">100%</button>
    </body>
</html>
